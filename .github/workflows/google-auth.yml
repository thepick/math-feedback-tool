name: Google authentication checks

on:
  pull_request:
    paths:
      - index.html
      - test-google-auth.cjs
      - .github/workflows/google-auth.yml
  push:
    branches: [main]
    paths:
      - index.html
      - test-google-auth.cjs
      - .github/workflows/google-auth.yml

permissions:
  contents: read

jobs:
  google-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test test-google-auth.cjs
